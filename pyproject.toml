[project]
name = "tinyml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch>=2.7", "numpy", "psutil"]

[dependency-groups]
dev = ["pytest"]
export = [
    "tensorflow>=2.21.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
